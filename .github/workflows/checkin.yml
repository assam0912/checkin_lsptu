name: 漫画站每日签到

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 0. 检查今日签到状态 (getUserMission)
        id: check_status
        run: |
          echo "正在查询今日签到状态..."
          status_response=$(curl -s -X POST 'https://zly26.com/wp-json/b2/v1/getUserMission' \
            -H 'authorization: ${{ secrets.AUTH_TOKEN }}' \
            -H 'cookie: ${{ secrets.COOKIE }}' \
            -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
            -H 'referer: https://zly26.com/task' \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data 'count=10&paged=1')

          echo "--------------------------------------------"
          echo "签到状态接口原始响应:"
          # 使用 jq 格式化，如果 jq 失败（比如返回了 HTML）则原样输出
          echo "$status_response" | jq . 2>/dev/null || echo "$status_response"
          echo "--------------------------------------------"

          # 验证返回是否为合法的 JSON
          if ! echo "$status_response" | jq empty 2>/dev/null; then
            echo "错误：返回的内容不是合法的 JSON 格式（可能是 Cookie 过期或更换了域名）"
            exit 1
          fi

          credit=$(echo "$status_response" | jq -r '.mission.credit // 0')
          echo "mission.credit = [$credit]"

          if [ "$credit" != "0" ] && [ "$credit" != "null" ]; then
            echo "今日已签到，无需重复签到。"
            my_credit=$(echo "$status_response" | jq -r '.mission.my_credit // "0"')
            echo "今日获得积分: $credit"
            echo "当前总积分: $my_credit"
            echo "already_signed=true" >> $GITHUB_OUTPUT
          else
            echo "今日尚未签到，准备执行签到请求..."
            echo "already_signed=false" >> $GITHUB_OUTPUT
          fi

      - name: 设置 Python 环境 (用于识别验证码)
        if: steps.check_status.outputs.already_signed == 'false'
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装验证码识别库
        if: steps.check_status.outputs.already_signed == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install ddddocr Pillow

      - name: 1. 获取挑战 (flashMissionStart)
        id: step1_start
        if: steps.check_status.outputs.already_signed == 'false'
        run: |
          echo "正在获取签到挑战..."
          response=$(curl -s -X POST 'https://zly26.com/wp-json/b2/v1/flashMissionStart' \
            -H 'authorization: ${{ secrets.AUTH_TOKEN }}' \
            -H 'cookie: ${{ secrets.COOKIE }}' \
            -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
            -H 'referer: https://zly26.com/task')

          echo "--------------------------------------------"
          echo "获取挑战接口响应:"
          echo "$response" | jq . 2>/dev/null || echo "$response"
          echo "--------------------------------------------"

          challenge=$(echo "$response" | jq -r '.challenge // empty')
          if [ -z "$challenge" ]; then
            echo "获取 challenge 失败！"
            exit 1
          fi
          echo "获取到 challenge: $challenge"
          echo "challenge=$challenge" >> $GITHUB_OUTPUT

      - name: 2. 获取验证码、识别并提交 (带重试)
        if: steps.check_status.outputs.already_signed == 'false'
        run: |
          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false
          
          # 获取上一步的 challenge
          challenge="${{ steps.step1_start.outputs.challenge }}"

          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$SUCCESS" = false ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "============================================"
            echo "第 $RETRY_COUNT 次尝试获取并识别验证码 (最多 $MAX_RETRIES 次)"
            echo "============================================"

            # --- 2.1 获取验证码 ---
            echo "正在提交站点答案并获取新验证码..."
            answer_response=$(curl -s -X POST 'https://zly26.com/wp-json/b2/v1/flashMissionAnswer' \
              -H 'authorization: ${{ secrets.AUTH_TOKEN }}' \
              -H 'cookie: ${{ secrets.COOKIE }}' \
              -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
              -H 'referer: https://zly26.com/task' \
              -H 'content-type: application/x-www-form-urlencoded' \
              --data-urlencode "challenge=$challenge" \
              --data-urlencode "answers[0]=www.zcys.me")

            captcha_token=$(echo "$answer_response" | jq -r '.captcha.token // empty')
            captcha_base64=$(echo "$answer_response" | jq -r '.captcha.base // empty')
            
            if [ -z "$captcha_base64" ] || [ "$captcha_base64" == "null" ]; then
              echo "获取验证码失败！响应: $answer_response"
              continue # 失败则跳过本次循环重试
            fi
            
            # 保存验证码图片
            echo "$captcha_base64" | sed 's/data:image\/png;base64,//' | base64 -d > captcha.png
            
            # --- 2.2 OCR 识别 ---
            cat << 'EOF' > ocr.py
          import ddddocr
          ocr = ddddocr.DdddOcr(show_ad=False)
          with open("captcha.png", 'rb') as f:
              img_bytes = f.read()
          res = ocr.classification(img_bytes)
          print(res)
          EOF
            
            img_code=$(python ocr.py)
            echo "OCR 识别结果: [$img_code]"

            # --- 2.3 提交最终签到 ---
            echo "正在提交签到..."
            final_response=$(curl -s -X POST 'https://zly26.com/wp-json/b2/v1/userMission' \
              -H 'authorization: ${{ secrets.AUTH_TOKEN }}' \
              -H 'cookie: ${{ secrets.COOKIE }}' \
              -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
              -H 'referer: https://zly26.com/task' \
              -H 'content-type: application/x-www-form-urlencoded' \
              --data-urlencode "challenge=$challenge" \
              --data-urlencode "img_code=$img_code" \
              --data-urlencode "token=$captcha_token")

            echo "接口响应:"
            echo "$final_response" | jq . 2>/dev/null || echo "$final_response"

            # --- 2.4 判断结果 ---
            if echo "$final_response" | grep -q "验证码错误或失效"; then
              echo "❌ 验证码识别错误，准备重试..."
              sleep 2 # 等待 2 秒，避免请求过快
              continue # 进入下一次重试
            fi

            if echo "$final_response" | grep -qE '^[0-9]+$'; then
              echo "✅ 签到成功，返回数字: $final_response"
              SUCCESS=true
              break
            fi

            always=$(echo "$final_response" | jq -r '.mission.always // "0"' 2>/dev/null)
            if [ "$always" = "1" ]; then
              credit=$(echo "$final_response" | jq -r '.mission.credit // 0')
              my_credit=$(echo "$final_response" | jq -r '.mission.my_credit // 0')
              echo "✅ 签到结果: 今日签到已成功！"
              echo "今日获得积分: $credit"
              echo "当前总积分: $my_credit"
              SUCCESS=true
              break
            fi

            echo "❌ 签到失败，遇到了未知错误。不再重试。"
            exit 1
          done

          if [ "$SUCCESS" = false ]; then
            echo "⚠️ 已达到最大重试次数 ($MAX_RETRIES 次)，今日签到失败。"
            exit 1
          fi
