name: 漫画站每日签到

on:
  schedule:
    - cron: '0 16 * * *'  # 每天 UTC 16:00 (北京时间 0:00) 执行
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 获取今日签到状态
        id: check_status
        run: |
          echo "正在查询今日签到状态..."
          status_response=$(curl -s -X POST 'https://lsptu36.com/wp-json/b2/v1/getUserMission' \
            -H 'authorization: ${{ secrets.AUTH_TOKEN }}' \
            -H 'cookie: ${{ secrets.COOKIE }}' \
            -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
            -H 'referer: https://lsptu36.com/mission/always' \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data 'count=10&paged=1')

          echo "--------------------------------------------"
          echo "签到状态响应:"
          echo "$status_response" | python3 -m json.tool 2>/dev/null || echo "$status_response"
          echo "--------------------------------------------"

          if echo "$status_response" | grep -q '"always":"1"'; then
            echo "今日已签到，无需重复签到。"
            # 从 mission.credit 获取今日获得的积分
            credit=$(echo "$status_response" | grep -o '"credit":"[^"]*"' | head -1 | cut -d':' -f2 | tr -d '"')
            my_credit=$(echo "$status_response" | grep -o '"my_credit":"[^"]*"' | head -1 | cut -d':' -f2 | tr -d '"')
            echo "今日获得积分: $credit"
            echo "当前总积分: $my_credit"
            echo "already_signed=true" >> $GITHUB_OUTPUT
          else
            echo "今日尚未签到，将执行签到请求..."
            echo "already_signed=false" >> $GITHUB_OUTPUT
          fi

      - name: 执行签到请求
        if: steps.check_status.outputs.already_signed == 'false'
        run: |
          echo "正在执行签到..."
          response=$(curl -s -X POST 'https://lsptu36.com/wp-json/b2/v1/userMission' \
            -H 'authorization: ${{ secrets.AUTH_TOKEN }}' \
            -H 'cookie: ${{ secrets.COOKIE }}' \
            -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
            -H 'referer: https://lsptu36.com/mission/always' \
            -H 'content-length: 0')

          echo "--------------------------------------------"
          echo "签到响应:"
          echo "$response" | python3 -m json.tool 2>/dev/null || echo "$response"
          echo "--------------------------------------------"

          if echo "$response" | grep -q '"always":"1"'; then
            echo "签到结果: 今日签到已成功！"
            credit=$(echo "$response" | grep -o '"credit":"[^"]*"' | head -1 | cut -d':' -f2 | tr -d '"')
            my_credit=$(echo "$response" | grep -o '"my_credit":"[^"]*"' | head -1 | cut -d':' -f2 | tr -d '"')
            echo "今日获得积分: $credit"
            echo "当前总积分: $my_credit"
          elif echo "$response" | grep -q '"always":"0"'; then
            echo "签到结果: 请求已发送，但状态显示未签到，可能需要检查。"
          else
            echo "无法解析签到状态，请检查响应内容。"
          fi
