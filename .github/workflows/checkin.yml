name: 漫画站每日签到

on:
  schedule:
    - cron: '0 0 * * *'
      timezone: "Asia/Shanghai"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 获取今日签到状态
        id: check_status
        run: |
          echo "正在查询今日签到状态..."
          status_response=$(curl -s -X POST 'https://lsptu42.com/wp-json/b2/v1/getUserMission' \
            -H 'authorization: ${{ secrets.AUTH_TOKEN }}' \
            -H 'cookie: ${{ secrets.COOKIE }}' \
            -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
            -H 'referer: https://lsptu42.com/mission/always' \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data 'count=10&paged=1')

          # echo "--------------------------------------------"
          # echo "签到状态响应:"
          # echo "$status_response" | python3 -m json.tool 2>/dev/null || echo "$status_response"
          # echo "--------------------------------------------"

          credit=$(echo "$status_response" | jq -r '.mission.credit // 0')
          echo "mission.credit = [$credit]"

          if [ "$credit" = "0" ]; then
            echo "今日尚未签到，将执行签到请求..."
            echo "already_signed=false" >> $GITHUB_OUTPUT
          else
            echo "今日已签到，无需重复签到。"
            my_credit=$(echo "$status_response" | jq -r '.mission.my_credit // "0"')
            echo "今日获得积分: $credit"
            echo "当前总积分: $my_credit"
            echo "already_signed=true" >> $GITHUB_OUTPUT
          fi

      - name: 执行签到请求
        if: steps.check_status.outputs.already_signed == 'false'
        run: |
          echo "正在执行签到..."
          response=$(curl -s -X POST 'https://lsptu42.com/wp-json/b2/v1/userMission' \
            -H 'authorization: ${{ secrets.AUTH_TOKEN }}' \
            -H 'cookie: ${{ secrets.COOKIE }}' \
            -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
            -H 'referer: https://lsptu42.com/mission/always' \
            -H 'content-length: 0')

          echo "--------------------------------------------"
          echo "签到响应:"
          echo "$response" | python3 -m json.tool 2>/dev/null || echo "$response"
          echo "--------------------------------------------"

          # 纯数字响应 = 已签到
          if echo "$response" | grep -qE '^[0-9]+$'; then
            if (( response >= 1 && response <= 30 )); then
              echo "今日已签到，无需重复签到，今日获取积分：$response"
            else
              echo "返回的数字 $response 不在 1-30 的有效范围内！"
            fi
            exit 0
          fi

          always=$(echo "$response" | jq -r '.mission.always // .always // "0"' 2>/dev/null)

          if [ "$always" = "1" ]; then
            echo "签到结果: 今日签到已成功！"
            credit=$(echo "$response" | jq -r '.mission.credit // .credit // 0')
            my_credit=$(echo "$response" | jq -r '.mission.my_credit // 0')
            echo "今日获得积分: $credit"
            echo "当前总积分: $my_credit"
          else
            echo "无法解析签到状态，请检查响应内容。"
            echo "完整响应: $response"
            exit 1
          fi
